[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexigo-rag-api"
version = "0.1.0"
description = "A grounded legal-style document Q&A API using LangGraph and Pinecone."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "langchain-core>=0.3,<2",
    "langgraph>=0.2,<2",
    "pinecone>=6,<8",
    "openai>=2.45,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["lexigo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

